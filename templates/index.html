
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova AI // Next-Gen Voice Agent</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Inter", sans-serif;
            background: #020617;
            color: white;
        }

        /* =========================================
           CAMERA BACKGROUND
        ========================================= */

        #cameraBackground {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
            background: #020617;
            transform: scaleX(-1);
        }

        .camera-overlay {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                linear-gradient(
                    rgba(2, 6, 23, 0.72),
                    rgba(2, 6, 23, 0.82)
                );
            pointer-events: none;
        }

        .background-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;
        }

        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .page {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* =========================================
           NOVA CARD
        ========================================= */

        .nova-card {
            position: absolute;

            width: min(620px, calc(100vw - 30px));
            max-height: calc(100vh - 30px);

            overflow-y: auto;

            padding: 30px;

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(15, 23, 42, 0.78),
                    rgba(2, 6, 23, 0.70)
                );

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255,255,255,0.06);

            user-select: none;

            cursor: grab;

            transition:
                box-shadow 0.25s ease,
                border-color 0.25s ease;
        }

        .nova-card:active {
            cursor: grabbing;
        }

        .nova-card:hover {
            border-color: rgba(255,255,255,0.20);

            box-shadow:
                0 35px 90px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .nova-card::-webkit-scrollbar {
            width: 6px;
        }

        .nova-card::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
        }

        /* =========================================
           HEADER
        ========================================= */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nova-logo {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #94a3b8
                );

            color: #020617;

            font-weight: 800;
            font-size: 18px;

            box-shadow:
                0 8px 25px rgba(255,255,255,0.15);
        }

        .brand-text h1 {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .brand-text p {
            margin-top: 3px;

            color: #94a3b8;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 8px 11px;

            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 999px;

            background: rgba(255,255,255,0.04);

            color: #cbd5e1;

            font-size: 10px;
            font-weight: 700;

            letter-spacing: 1px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 12px rgba(34,197,94,0.8);
        }

        /* =========================================
           MIC SECTION
        ========================================= */

        .mic-section {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin-bottom: 25px;
        }

        .mic-button {
            width: 120px;
            height: 120px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    rgba(255,255,255,0.16),
                    rgba(255,255,255,0.035)
                );

            color: white;

            font-size: 42px;

            cursor: pointer;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.10);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .mic-button:hover {
            transform: scale(1.05);

            box-shadow:
                0 25px 70px rgba(0,0,0,0.55),
                0 0 35px rgba(255,255,255,0.08);
        }

        .mic-button.listening {
            animation: micPulse 1.2s infinite;
        }

        @keyframes micPulse {

            0% {
                transform: scale(1);
                box-shadow:
                    0 0 0 0 rgba(255,255,255,0.18);
            }

            70% {
                transform: scale(1.05);
                box-shadow:
                    0 0 0 24px rgba(255,255,255,0);
            }

            100% {
                transform: scale(1);
                box-shadow:
                    0 0 0 0 rgba(255,255,255,0);
            }
        }

        .mic-hint {
            margin-top: 14px;

            color: #94a3b8;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        /* =========================================
           TRANSCRIPT
        ========================================= */

        .transcript-box {
            margin-bottom: 20px;

            padding: 16px 18px;

            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;

            background: rgba(255,255,255,0.035);
        }

        .section-label {
            margin-bottom: 8px;

            color: #64748b;

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        #transcript {
            min-height: 20px;

            color: #e2e8f0;

            font-size: 13px;
            line-height: 1.6;

            word-break: break-word;
        }

        /* =========================================
           EMAIL EDITOR
        ========================================= */

        .email-editor {
            display: none;

            margin-top: 20px;

            padding: 20px;

            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;

            background:
                rgba(15,23,42,0.70);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .email-editor.visible {
            display: block;

            animation: editorAppear 0.3s ease;
        }

        @keyframes editorAppear {

            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .email-title {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .email-title-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .email-icon {
            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: rgba(255,255,255,0.08);

            font-size: 15px;
        }

        .email-title h2 {
            font-size: 13px;
            font-weight: 800;

            letter-spacing: 0.3px;
        }

        .ai-badge {
            padding: 5px 8px;

            border-radius: 999px;

            background: rgba(255,255,255,0.06);

            color: #cbd5e1;

            font-size: 8px;
            font-weight: 800;

            letter-spacing: 1px;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            color: #64748b;

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 1.3px;
            text-transform: uppercase;
        }

        .field input,
        .field textarea {
            width: 100%;

            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 12px;

            outline: none;

            background:
                rgba(2,6,23,0.65);

            color: #f8fafc;

            font-family: "Inter", sans-serif;

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .field input {
            height: 46px;
            padding: 0 14px;

            font-size: 13px;
            font-weight: 500;
        }

        .field textarea {
            min-height: 190px;

            padding: 14px;

            resize: vertical;

            font-size: 13px;
            line-height: 1.65;

            user-select: text;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: rgba(255,255,255,0.25);

            background:
                rgba(2,6,23,0.82);
        }

        /* =========================================
           EMAIL ACTIONS
        ========================================= */

        .email-actions {
            display: flex;
            gap: 10px;

            margin-top: 18px;
        }

        .gmail-button,
        .regenerate-button {
            height: 46px;

            border-radius: 12px;

            font-family: "Inter", sans-serif;
            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .gmail-button {
            flex: 1;

            border: 1px solid rgba(255,255,255,0.15);

            background:
                rgba(255,255,255,0.95);

            color: #020617;

            font-size: 12px;
            letter-spacing: 0.3px;
        }

        .gmail-button:hover {
            transform: translateY(-1px);

            background: white;
        }

        .regenerate-button {
            padding: 0 15px;

            border: 1px solid rgba(255,255,255,0.10);

            background: rgba(255,255,255,0.05);

            color: #cbd5e1;

            font-size: 11px;
        }

        .regenerate-button:hover {
            background: rgba(255,255,255,0.09);
        }

        .enter-hint {
            margin-top: 11px;

            text-align: center;

            color: #64748b;

            font-size: 9px;
            font-weight: 600;

            letter-spacing: 0.5px;
        }

        .enter-key {
            display: inline-block;

            padding: 2px 6px;

            margin: 0 3px;

            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 5px;

            background: rgba(255,255,255,0.05);

            color: #94a3b8;

            font-size: 8px;
        }

        /* =========================================
           COMMAND CHIPS
        ========================================= */

        .commands {
            margin-top: 20px;
        }

        .commands-title {
            margin-bottom: 10px;

            color: #64748b;

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .command-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .command-chip {
            padding: 9px 11px;

            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;

            background: rgba(255,255,255,0.035);

            color: #94a3b8;

            font-size: 10px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .command-chip:hover {
            background: rgba(255,255,255,0.08);

            color: #f8fafc;

            transform: translateY(-1px);
        }

        /* =========================================
           FOOTER STATUS
        ========================================= */

        .footer-status {
            margin-top: 20px;

            padding-top: 15px;

            border-top: 1px solid rgba(255,255,255,0.06);

            text-align: center;

            color: #64748b;

            font-size: 9px;
            font-weight: 700;

            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .nova-card {
                padding: 22px;

                border-radius: 22px;
            }

            .header {
                margin-bottom: 22px;
            }

            .mic-button {
                width: 100px;
                height: 100px;

                font-size: 34px;
            }

            .status-pill {
                display: none;
            }

            .email-actions {
                flex-direction: column;
            }

            .regenerate-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         CAMERA
    ========================================== -->

    <video
        id="cameraBackground"
        autoplay
        muted
        playsinline
    ></video>

    <div class="camera-overlay"></div>
    <div class="background-grid"></div>


    <main class="page">

        <!-- =====================================
             NOVA CARD
        ====================================== -->

        <section
            class="nova-card"
            id="novaCard"
        >

            <!-- HEADER -->

            <header class="header">

                <div class="brand">

                    <div class="nova-logo">
                        N
                    </div>

                    <div class="brand-text">

                        <h1>Nova AI</h1>

                        <p>
                            Next-Gen Voice Agent
                        </p>

                    </div>

                </div>

                <div class="status-pill">

                    <span class="status-dot"></span>

                    <span id="status">
                        READY
                    </span>

                </div>

            </header>


            <!-- =================================
                 MICROPHONE
            ================================== -->

            <div class="mic-section">

                <button
                    class="mic-button"
                    id="micButton"
                    type="button"
                    aria-label="Start voice command"
                >
                    🎙️
                </button>

                <div class="mic-hint">
                    Tap & speak
                </div>

            </div>


            <!-- =================================
                 VOICE TRANSCRIPT
            ================================== -->

            <div class="transcript-box">

                <div class="section-label">
                    Voice Command
                </div>

                <div id="transcript">
                    Say something like:
                    "Open Gmail and write an email to my client..."
                </div>

            </div>


            <!-- =================================
                 EMAIL EDITOR
            ================================== -->

            <section
                class="email-editor"
                id="emailEditor"
            >

                <div class="email-title">

                    <div class="email-title-left">

                        <div class="email-icon">
                            ✉
                        </div>

                        <h2>
                            AI EMAIL PREVIEW
                        </h2>

                    </div>

                    <div class="ai-badge">
                        AI GENERATED
                    </div>

                </div>


                <!-- SUBJECT -->

                <div class="field">

                    <label for="emailSubject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="emailSubject"
                        placeholder="Email subject"
                        autocomplete="off"
                    >

                </div>


                <!-- BODY -->

                <div class="field">

                    <label for="emailBody">
                        Email Body
                    </label>

                    <textarea
                        id="emailBody"
                        placeholder="Your generated email will appear here..."
                    ></textarea>

                </div>


                <!-- ACTIONS -->

                <div class="email-actions">

                    <button
                        class="gmail-button"
                        id="openGmailButton"
                        type="button"
                    >
                        Open in Gmail →
                    </button>

                    <button
                        class="regenerate-button"
                        id="regenerateButton"
                        type="button"
                    >
                        ↻ Regenerate
                    </button>

                </div>

                <div class="enter-hint">

                    Press

                    <span class="enter-key">
                        ENTER
                    </span>

                    to open Gmail

                </div>

            </section>


            <!-- =================================
                 COMMANDS
            ================================== -->

            <div class="commands">

                <div class="commands-title">
                    Quick Commands
                </div>

                <div class="command-list">

                    <button
                        class="command-chip"
                        data-command="Open YouTube and play a relaxing music video"
                    >
                        ▶ YouTube
                    </button>

                    <button
                        class="command-chip"
                        data-command="Open Gmail and write an email to my client about our new business proposal"
                    >
                        ✉ Gmail
                    </button>

                    <button
                        class="command-chip"
                        data-command="Search Google for latest artificial intelligence news"
                    >
                        🔎 Google
                    </button>

                </div>

            </div>


            <!-- FOOTER -->

            <div class="footer-status">
                Nova Core • Voice Controlled • AI Powered
            </div>

        </section>

    </main>


    <script>

        /* =========================================
           ELEMENTS
        ========================================= */

        const novaCard = document.getElementById("novaCard");

        const micButton = document.getElementById("micButton");

        const transcript =
            document.getElementById("transcript");

        const status =
            document.getElementById("status");

        const emailEditor =
            document.getElementById("emailEditor");

        const emailSubject =
            document.getElementById("emailSubject");

        const emailBody =
            document.getElementById("emailBody");

        const openGmailButton =
            document.getElementById("openGmailButton");

        const regenerateButton =
            document.getElementById("regenerateButton");

        const cameraBackground =
            document.getElementById("cameraBackground");


        /* =========================================
           GLOBAL STATE
        ========================================= */

        let gmailWindow = null;

        let lastEmailCommand = "";

        let recognition = null;

        let isDragging = false;

        let dragOffsetX = 0;

        let dragOffsetY = 0;


        /* =========================================
           GMAIL WINDOW
           
           Only ONE Gmail window is maintained.
        ========================================= */

        function openGmail(url) {

            if (!url) {
                return;
            }

            if (
                gmailWindow &&
                !gmailWindow.closed
            ) {

                gmailWindow.location.href = url;

                try {
                    gmailWindow.focus();
                } catch (error) {
                    console.log(error);
                }

                return;
            }


            gmailWindow =
                window.open(
                    url,
                    "NovaGmailWindow"
                );


            if (gmailWindow) {

                try {
                    gmailWindow.focus();
                } catch (error) {
                    console.log(error);
                }

            } else {

                status.textContent =
                    "ALLOW POPUPS FOR NOVA AI";

            }

        }


        /* =========================================
           CREATE GMAIL COMPOSE URL
           
           This uses the edited values from
           the frontend.
        ========================================= */

        function createGmailUrl(subject, body) {

            const baseUrl =
                "https://mail.google.com/mail/u/0/?view=cm&fs=1";

            const params = new URLSearchParams();

            params.set(
                "su",
                subject || ""
            );

            params.set(
                "body",
                body || ""
            );

            return (
                baseUrl +
                "&" +
                params.toString()
            );

        }


        /* =========================================
           OPEN CURRENT EMAIL IN GMAIL
        ========================================= */

        function openCurrentEmailInGmail() {

            const subject =
                emailSubject.value.trim();

            const body =
                emailBody.value.trim();


            if (!body) {

                status.textContent =
                    "EMAIL BODY IS EMPTY";

                emailBody.focus();

                return;

            }


            const gmailUrl =
                createGmailUrl(
                    subject,
                    body
                );


            status.textContent =
                "OPENING GMAIL...";


            openGmail(gmailUrl);

        }


        /* =========================================
           SHOW GENERATED EMAIL
           
           Backend should return:
           
           {
               success: true,
               type: "email",
               subject: "...",
               body: "..."
           }
        ========================================= */

        function showEmailEditor(data) {

            emailSubject.value =
                data.subject || "";

            emailBody.value =
                data.body || "";


            emailEditor.classList.add(
                "visible"
            );


            status.textContent =
                "EMAIL READY TO REVIEW";


            /*
             * Do NOT open Gmail here.
             *
             * User must review/edit first.
             */


            setTimeout(() => {

                emailBody.focus();

            }, 100);

        }


        /* =========================================
           SEND COMMAND TO FLASK BACKEND
        ========================================= */

        async function sendCommand(
            cmdText
        ) {

            try {

                status.textContent =
                    "CONNECTING TO NOVA CORE...";


                transcript.textContent =
                    cmdText;


                console.log(
                    "Nova command:",
                    cmdText
                );


                const response =
                    await fetch(
                        "/agent",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                command: cmdText
                            })
                        }
                    );


                console.log(
                    "Agent HTTP status:",
                    response.status
                );


                let data;

                try {

                    data =
                        await response.json();

                } catch (jsonError) {

                    throw new Error(
                        "Server returned invalid JSON."
                    );

                }


                console.log(
                    "Agent response:",
                    data
                );


                if (!response.ok) {

                    status.textContent =
                        data.message ||
                        `AGENT ERROR ${response.status}`;

                    return;

                }


                if (!data.success) {

                    status.textContent =
                        data.message ||
                        "COMMAND FAILED";

                    return;

                }


                /* =================================
                   EMAIL RESPONSE
                ================================= */

                if (
                    data.type === "email" ||
                    data.email_generated === true
                ) {

                    lastEmailCommand =
                        cmdText;

                    showEmailEditor(data);

                    return;

                }


                /* =================================
                   NORMAL URL RESPONSE
                   
                   YouTube / Google etc.
                ================================= */

                if (data.url) {

                    const isGmail =
                        data.url.includes(
                            "mail.google.com"
                        );


                    if (isGmail) {

                        /*
                         * Normally email commands
                         * should now return type=email.
                         *
                         * This is just a safety fallback.
                         */

                        openGmail(data.url);

                    } else {

                        const newWindow =
                            window.open(
                                data.url,
                                "_blank"
                            );


                        if (newWindow) {

                            try {
                                newWindow.focus();
                            } catch (error) {
                                console.log(error);
                            }

                        } else {

                            status.textContent =
                                "ALLOW POPUPS FOR NOVA AI";

                        }

                    }

                }


                status.textContent =
                    data.message ||
                    "COMMAND EXECUTED";


            } catch (error) {

                console.error(
                    "NOVA AGENT ERROR:",
                    error
                );


                status.textContent =
                    "AGENT CONNECTION FAILED";


                setTimeout(() => {

                    status.textContent =
                        error.message ||
                        "CHECK BACKEND CONNECTION";

                }, 2500);

            }

        }


        /* =========================================
           REGENERATE EMAIL
        ========================================= */

        regenerateButton.addEventListener(
            "click",
            async () => {

                if (!lastEmailCommand) {

                    status.textContent =
                        "NO EMAIL REQUEST FOUND";

                    return;

                }


                status.textContent =
                    "REGENERATING EMAIL...";


                emailEditor.classList.remove(
                    "visible"
                );


                await sendCommand(
                    lastEmailCommand
                );

            }
        );


        /* =========================================
           OPEN GMAIL BUTTON
        ========================================= */

        openGmailButton.addEventListener(
            "click",
            () => {

                openCurrentEmailInGmail();

            }
        );


        /* =========================================
           ENTER KEY
           
           Enter anywhere inside the email editor
           opens Gmail.
           
           Shift + Enter inside textarea
           creates a new line.
        ========================================= */

        emailEditor.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    /*
                     * For textarea:
                     * Enter normally means newline.
                     *
                     * We intentionally use Enter
                     * as the confirmation action.
                     */

                    event.preventDefault();

                    openCurrentEmailInGmail();

                }

            }
        );


        /* =========================================
           SPEECH RECOGNITION
        ========================================= */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (SpeechRecognition) {

            recognition =
                new SpeechRecognition();


            recognition.continuous =
                false;


            recognition.interimResults =
                false;


            recognition.lang =
                "en-US";


            recognition.onstart =
                () => {

                    micButton.classList.add(
                        "listening"
                    );


                    micButton.textContent =
                        "🔴";


                    status.textContent =
                        "LISTENING...";

                };


            recognition.onresult =
                (event) => {

                    const command =
                        event
                            .results[0][0]
                            .transcript
                            .trim();


                    transcript.textContent =
                        command;


                    if (command) {

                        sendCommand(
                            command
                        );

                    }

                };


            recognition.onerror =
                (event) => {

                    console.error(
                        "Speech recognition error:",
                        event.error
                    );


                    status.textContent =
                        "VOICE INPUT ERROR";

                };


            recognition.onend =
                () => {

                    micButton.classList.remove(
                        "listening"
                    );


                    micButton.textContent =
                        "🎙️";


                    if (
                        status.textContent ===
                        "LISTENING..."
                    ) {

                        status.textContent =
                            "READY";

                    }

                };

        } else {

            status.textContent =
                "VOICE NOT SUPPORTED";

        }


        /* =========================================
           MICROPHONE BUTTON
        ========================================= */

        micButton.addEventListener(
            "click",
            () => {

                if (!recognition) {

                    alert(
                        "Speech recognition is not supported in this browser."
                    );

                    return;

                }


                try {

                    recognition.start();

                } catch (error) {

                    console.log(
                        "Recognition already running."
                    );

                }

            }
        );


        /* =========================================
           QUICK COMMANDS
        ========================================= */

        document
            .querySelectorAll(".command-chip")
            .forEach((chip) => {

                chip.addEventListener(
                    "click",
                    function () {

                        const command =
                            this.dataset.command;


                        transcript.textContent =
                            command;


                        sendCommand(
                            command
                        );

                    }
                );

            });


        /* =========================================
           CAMERA
        ========================================= */

        async function startCamera() {

            try {

                const stream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({
                            video: {
                                facingMode: "user"
                            },
                            audio: false
                        });


                cameraBackground.srcObject =
                    stream;


            } catch (error) {

                console.warn(
                    "Camera unavailable:",
                    error
                );

            }

        }


        startCamera();


        /* =========================================
           DRAGGABLE NOVA CARD
           
           Pointer Events support:
           - Mouse
           - Touch
           - Pen
        ========================================= */

        novaCard.addEventListener(
            "pointerdown",
            (event) => {

                /*
                 * Don't start dragging when the user
                 * interacts with form controls/buttons.
                 */

                const tag =
                    event.target.tagName.toLowerCase();


                const isInteractive =
                    [
                        "button",
                        "input",
                        "textarea",
                        "select",
                        "a"
                    ].includes(tag);


                if (isInteractive) {
                    return;
                }


                isDragging = true;


                const rect =
                    novaCard.getBoundingClientRect();


                dragOffsetX =
                    event.clientX -
                    rect.left;


                dragOffsetY =
                    event.clientY -
                    rect.top;


                novaCard.setPointerCapture(
                    event.pointerId
                );

            }
        );


        novaCard.addEventListener(
            "pointermove",
            (event) => {

                if (!isDragging) {
                    return;
                }


                let x =
                    event.clientX -
                    dragOffsetX;


                let y =
                    event.clientY -
                    dragOffsetY;


                const cardWidth =
                    novaCard.offsetWidth;


                const cardHeight =
                    novaCard.offsetHeight;


                const maxX =
                    window.innerWidth -
                    cardWidth;


                const maxY =
                    window.innerHeight -
                    cardHeight;


                x =
                    Math.max(
                        0,
                        Math.min(
                            x,
                            maxX
                        )
                    );


                y =
                    Math.max(
                        0,
                        Math.min(
                            y,
                            maxY
                        )
                    );


                novaCard.style.left =
                    `${x}px`;


                novaCard.style.top =
                    `${y}px`;


                novaCard.style.transform =
                    "none";

            }
        );


        function stopDragging() {

            isDragging = false;

        }


        novaCard.addEventListener(
            "pointerup",
            stopDragging
        );


        novaCard.addEventListener(
            "pointercancel",
            stopDragging
        );


        novaCard.addEventListener(
            "lostpointercapture",
            stopDragging
        );


        /* =========================================
           WINDOW RESIZE
           
           Keep card inside viewport.
        ========================================= */

        window.addEventListener(
            "resize",
            () => {

                const rect =
                    novaCard.getBoundingClientRect();


                let x =
                    rect.left;


                let y =
                    rect.top;


                const maxX =
                    window.innerWidth -
                    novaCard.offsetWidth;


                const maxY =
                    window.innerHeight -
                    novaCard.offsetHeight;


                x =
                    Math.max(
                        0,
                        Math.min(
                            x,
                            maxX
                        )
                    );


                y =
                    Math.max(
                        0,
                        Math.min(
                            y,
                            maxY
                        )
                    );


                novaCard.style.left =
                    `${x}px`;


                novaCard.style.top =
                    `${y}px`;


                novaCard.style.transform =
                    "none";

            }
        );

    </script>

</body>

</html>
