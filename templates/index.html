<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nova AI // Next-Gen Voice Agent</title>

    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: "Inter", sans-serif;
            background: #050505;
            color: white;
        }

        /* ==========================================
           CAMERA BACKGROUND
        ========================================== */

        #cameraBackground {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            z-index: 0;

            filter:
                brightness(0.32)
                contrast(1.1)
                saturate(0.8);

        }

        /* ==========================================
           BACKGROUND OVERLAY
        ========================================== */

        .background-overlay {

            position: fixed;

            inset: 0;

            z-index: 1;

            background:
                radial-gradient(
                    circle at center,
                    rgba(0, 0, 0, 0.05),
                    rgba(0, 0, 0, 0.75)
                );

            pointer-events: none;

        }

        /* ==========================================
           MAIN APP
        ========================================== */

        .app {

            position: relative;

            z-index: 5;

            width: 100%;
            height: 100vh;

        }

        /* ==========================================
           HEADER
        ========================================== */

        .topbar {

            position: absolute;

            top: 25px;
            left: 30px;
            right: 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            z-index: 20;

        }

        .logo {

            display: flex;

            align-items: center;

            gap: 12px;

            font-weight: 800;

            letter-spacing: 0.08em;

            font-size: 16px;

        }

        .logo-dot {

            width: 10px;
            height: 10px;

            border-radius: 50%;

            background: white;

            box-shadow:
                0 0 15px rgba(255,255,255,0.9);

        }

        .online {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 11px;

            color: rgba(255,255,255,0.65);

            letter-spacing: 0.12em;

        }

        .online-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #55ff8a;

            box-shadow:
                0 0 12px rgba(85,255,138,0.9);

        }

        /* ==========================================
           MAIN CARD
        ========================================== */

        #voiceCard {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width: min(460px, 90vw);

            padding: 34px;

            border-radius: 28px;

            background:
                rgba(255,255,255,0.075);

            border:
                1px solid
                rgba(255,255,255,0.14);

            backdrop-filter:
                blur(28px);

            -webkit-backdrop-filter:
                blur(28px);

            box-shadow:
                0 30px 100px
                rgba(0,0,0,0.45),

                inset 0 1px 0
                rgba(255,255,255,0.08);

            cursor: grab;

            user-select: none;

        }

        #voiceCard.dragging {

            cursor: grabbing;

            transition: none;

        }

        /* ==========================================
           CARD HEADER
        ========================================== */

        .card-header {

            text-align: center;

            margin-bottom: 28px;

        }

        .card-title {

            font-size: 30px;

            font-weight: 800;

            letter-spacing: -0.04em;

        }

        .card-subtitle {

            margin-top: 8px;

            font-size: 12px;

            color:
                rgba(255,255,255,0.48);

            letter-spacing:
                0.13em;

            text-transform:
                uppercase;

        }

        /* ==========================================
           MICROPHONE
        ========================================== */

        .mic-area {

            display: flex;

            justify-content: center;

            align-items: center;

            margin: 15px 0 25px;

        }

        #micButton {

            width: 125px;
            height: 125px;

            border-radius: 50%;

            border: 1px solid
                rgba(255,255,255,0.25);

            background:
                rgba(255,255,255,0.08);

            display: flex;

            justify-content: center;

            align-items: center;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;

            box-shadow:
                0 0 0 rgba(255,255,255,0);

        }

        #micButton:hover {

            transform:
                scale(1.05);

            background:
                rgba(255,255,255,0.14);

        }

        #micButton.listening {

            animation:
                micPulse 1.4s infinite;

        }

        @keyframes micPulse {

            0% {
                box-shadow:
                    0 0 0 0
                    rgba(255,255,255,0.35);
            }

            70% {
                box-shadow:
                    0 0 0 25px
                    rgba(255,255,255,0);
            }

            100% {
                box-shadow:
                    0 0 0 0
                    rgba(255,255,255,0);
            }

        }

        .mic-icon {

            width: 42px;
            height: 42px;

            fill: white;

        }

        /* ==========================================
           STATUS
        ========================================== */

        #status {

            text-align: center;

            font-size: 10px;

            letter-spacing:
                0.14em;

            color:
                rgba(255,255,255,0.58);

            min-height: 16px;

            margin-bottom: 15px;

        }

        /* ==========================================
           TRANSCRIPT
        ========================================== */

        .transcript-box {

            min-height: 75px;

            padding: 15px;

            border-radius: 16px;

            background:
                rgba(0,0,0,0.18);

            border:
                1px solid
                rgba(255,255,255,0.08);

        }

        .transcript-label {

            font-size: 9px;

            color:
                rgba(255,255,255,0.38);

            letter-spacing:
                0.12em;

            text-transform:
                uppercase;

            margin-bottom: 7px;

        }

        #transcript {

            font-size: 13px;

            line-height: 1.5;

            color:
                rgba(255,255,255,0.82);

            word-break: break-word;

        }

        /* ==========================================
           COMMAND CHIPS
        ========================================== */

        .commands {

            margin-top: 18px;

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 8px;

        }

        .command-chip {

            border: 1px solid
                rgba(255,255,255,0.1);

            background:
                rgba(255,255,255,0.055);

            color:
                rgba(255,255,255,0.68);

            padding:
                8px 12px;

            border-radius: 999px;

            font-size: 10px;

            cursor: pointer;

            transition:
                all 0.2s ease;

        }

        .command-chip:hover {

            background:
                rgba(255,255,255,0.12);

            color: white;

            transform:
                translateY(-2px);

        }

        /* ==========================================
           FOOTER
        ========================================== */

        .footer {

            position: absolute;

            bottom: 22px;

            left: 0;
            right: 0;

            text-align: center;

            z-index: 20;

            font-size: 9px;

            color:
                rgba(255,255,255,0.3);

            letter-spacing:
                0.12em;

        }

        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .topbar {

                top: 18px;
                left: 18px;
                right: 18px;

            }

            #voiceCard {

                padding: 25px;

                width: 92vw;

            }

            .card-title {

                font-size: 25px;

            }

            #micButton {

                width: 105px;
                height: 105px;

            }

        }

    </style>

</head>


<body>

    <!-- ==========================================
         CAMERA
    ========================================== -->

    <video
        id="cameraBackground"
        autoplay
        muted
        playsinline
    ></video>


    <div class="background-overlay"></div>


    <!-- ==========================================
         APP
    ========================================== -->

    <main class="app">


        <!-- ======================================
             TOP BAR
        ======================================= -->

        <header class="topbar">

            <div class="logo">

                <span class="logo-dot"></span>

                NOVA AI

            </div>


            <div class="online">

                <span class="online-dot"></span>

                CORE ONLINE

            </div>

        </header>


        <!-- ======================================
             VOICE CARD
        ======================================= -->

        <section id="voiceCard">


            <div class="card-header">

                <div class="card-title">
                    Nova Voice Agent
                </div>

                <div class="card-subtitle">
                    Speak. Command. Execute.
                </div>

            </div>


            <!-- ==================================
                 MICROPHONE
            =================================== -->

            <div class="mic-area">

                <button
                    id="micButton"
                    type="button"
                    aria-label="Start voice recognition"
                >

                    <svg
                        class="mic-icon"
                        viewBox="0 0 24 24"
                    >

                        <path
                            d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"
                        />

                        <path
                            d="M17.3 11a5.3 5.3 0 0 1-10.6 0H5a7 7 0 0 0 6 6.92V21H8v2h8v-2h-3v-3.08A7 7 0 0 0 19 11h-1.7Z"
                        />

                    </svg>

                </button>

            </div>


            <!-- ==================================
                 STATUS
            =================================== -->

            <div id="status">
                READY FOR COMMAND
            </div>


            <!-- ==================================
                 TRANSCRIPT
            =================================== -->

            <div class="transcript-box">

                <div class="transcript-label">
                    Voice Command
                </div>

                <div id="transcript">
                    Say something like:
                    "Open Gmail and write an email..."
                </div>

            </div>


            <!-- ==================================
                 QUICK COMMANDS
            =================================== -->

            <div class="commands">

                <button
                    class="command-chip"
                    data-command="Open YouTube and play a relaxing music video"
                >
                    ▶ YouTube
                </button>


                <button
                    class="command-chip"
                    data-command="Open Gmail and write an email to my client about our new business proposal"
                >
                    ✉ Gmail
                </button>


                <button
                    class="command-chip"
                    data-command="Search Google for latest artificial intelligence news"
                >
                    🔎 Google
                </button>

            </div>


        </section>


        <!-- ======================================
             FOOTER
        ======================================= -->

        <footer class="footer">

            NOVA AI // NEXT-GEN VOICE AGENT

        </footer>


    </main>


    <script>

        // ==================================================
        // ELEMENTS
        // ==================================================

        const micButton =
            document.getElementById("micButton");

        const status =
            document.getElementById("status");

        const transcript =
            document.getElementById("transcript");

        const voiceCard =
            document.getElementById("voiceCard");

        const cameraBackground =
            document.getElementById(
                "cameraBackground"
            );


        // ==================================================
        // GMAIL WINDOW
        // ==================================================

        /*
         * IMPORTANT:
         *
         * We keep ONE Gmail window.
         *
         * Every new Gmail command will reuse
         * the same browser window instead of
         * opening another tab.
         */

        let gmailWindow = null;


        // ==================================================
        // OPEN GMAIL
        // ==================================================

        function openGmail(url) {

            if (!url) {
                return;
            }


            // ----------------------------------------------
            // Existing Gmail window
            // ----------------------------------------------

            if (
                gmailWindow &&
                !gmailWindow.closed
            ) {

                gmailWindow.location.href =
                    url;

                try {
                    gmailWindow.focus();
                } catch (error) {
                    console.log(error);
                }

                return;

            }


            // ----------------------------------------------
            // Create Gmail window
            // ----------------------------------------------

            gmailWindow = window.open(
                url,
                "NovaGmailWindow"
            );


            if (gmailWindow) {

                try {
                    gmailWindow.focus();
                } catch (error) {
                    console.log(error);
                }

            } else {

                status.textContent =
                    "PLEASE ALLOW POPUPS FOR NOVA AI";

            }

        }


        // ==================================================
        // OPEN AGENT RESULT
        // ==================================================

        function openAgentResult(url) {

            if (!url) {
                return;
            }


            const isGmail =
                url.includes(
                    "mail.google.com"
                );


            // ----------------------------------------------
            // Gmail → Reuse same window
            // ----------------------------------------------

            if (isGmail) {

                openGmail(url);

                return;

            }


            // ----------------------------------------------
            // Other services → New tab
            // ----------------------------------------------

            const newWindow =
                window.open(
                    url,
                    "_blank"
                );


            if (newWindow) {

                try {
                    newWindow.focus();
                } catch (error) {
                    console.log(error);
                }

            } else {

                status.textContent =
                    "PLEASE ALLOW POPUPS";

            }

        }


        // ==================================================
        // SEND COMMAND TO FLASK
        // ==================================================

        async function sendCommand(
            cmdText
        ) {

            try {

                status.textContent =
                    "CONNECTING TO NOVA CORE...";


                transcript.textContent =
                    cmdText;


                console.log(
                    "Nova command:",
                    cmdText
                );


                // ------------------------------------------
                // SEND REQUEST
                // ------------------------------------------

                const res =
                    await fetch(
                        "/agent",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                command:
                                    cmdText

                            })

                        }
                    );


                console.log(
                    "Agent HTTP status:",
                    res.status
                );


                // ------------------------------------------
                // Parse response
                // ------------------------------------------

                let data;

                try {

                    data =
                        await res.json();

                } catch (jsonError) {

                    throw new Error(
                        "Server returned invalid JSON."
                    );

                }


                console.log(
                    "Agent response:",
                    data
                );


                // ------------------------------------------
                // HTTP ERROR
                // ------------------------------------------

                if (!res.ok) {

                    status.textContent =
                        data.message ||
                        `AGENT ERROR ${res.status}`;

                    console.error(
                        "Backend error:",
                        data
                    );

                    return;

                }


                // ------------------------------------------
                // SUCCESS
                // ------------------------------------------

                if (data.success) {

                    status.textContent =
                        data.message ||
                        "COMMAND EXECUTED";


                    // --------------------------------------
                    // Show generated email in console
                    // --------------------------------------

                    if (
                        data.email_generated
                    ) {

                        console.log(
                            "Generated Email:"
                        );

                        console.log(
                            "Subject:",
                            data.subject
                        );

                        console.log(
                            "Body:",
                            data.body
                        );

                    }


                    // --------------------------------------
                    // Open result
                    // --------------------------------------

                    if (data.url) {

                        openAgentResult(
                            data.url
                        );

                    }

                } else {

                    status.textContent =
                        data.message ||
                        "COMMAND FAILED";


                    console.error(
                        "Nova command failed:",
                        data
                    );

                }

            } catch (error) {

                console.error(
                    "NOVA AGENT ERROR:",
                    error
                );


                status.textContent =
                    "AGENT CONNECTION FAILED";


                /*
                 * Show a more useful message
                 * after a short delay.
                 */

                setTimeout(() => {

                    status.textContent =
                        error.message ||
                        "CHECK BACKEND CONNECTION";

                }, 2500);

            }

        }


        // ==================================================
        // SPEECH RECOGNITION
        // ==================================================

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        let recognition = null;


        if (SpeechRecognition) {

            recognition =
                new SpeechRecognition();


            recognition.continuous =
                false;


            recognition.interimResults =
                false;


            recognition.lang =
                "en-US";


            // ----------------------------------------------
            // Speech started
            // ----------------------------------------------

            recognition.onstart =
                function () {

                    micButton.classList.add(
                        "listening"
                    );

                    status.textContent =
                        "LISTENING... SPEAK NOW";

                    transcript.textContent =
                        "Listening for your command...";

                };


            // ----------------------------------------------
            // Speech result
            // ----------------------------------------------

            recognition.onresult =
                function (event) {

                    const command =
                        event
                        .results[0][0]
                        .transcript
                        .trim();


                    console.log(
                        "Recognized speech:",
                        command
                    );


                    transcript.textContent =
                        command;


                    if (command) {

                        sendCommand(
                            command
                        );

                    }

                };


            // ----------------------------------------------
            // Speech error
            // ----------------------------------------------

            recognition.onerror =
                function (event) {

                    console.error(
                        "Speech recognition error:",
                        event.error
                    );


                    micButton.classList.remove(
                        "listening"
                    );


                    if (
                        event.error ===
                        "not-allowed"
                    ) {

                        status.textContent =
                            "MICROPHONE PERMISSION DENIED";

                    } else if (
                        event.error ===
                        "no-speech"
                    ) {

                        status.textContent =
                            "NO SPEECH DETECTED";

                    } else {

                        status.textContent =
                            "VOICE RECOGNITION ERROR";

                    }

                };


            // ----------------------------------------------
            // Speech ended
            // ----------------------------------------------

            recognition.onend =
                function () {

                    micButton.classList.remove(
                        "listening"
                    );


                    if (
                        status.textContent.includes(
                            "LISTENING"
                        )
                    ) {

                        status.textContent =
                            "READY FOR COMMAND";

                    }

                };

        } else {

            status.textContent =
                "VOICE RECOGNITION NOT SUPPORTED";

        }


        // ==================================================
        // MICROPHONE CLICK
        // ==================================================

        micButton.addEventListener(
            "click",
            function (event) {

                /*
                 * Prevent card dragging
                 * when clicking microphone.
                 */

                event.stopPropagation();


                if (!recognition) {

                    status.textContent =
                        "BROWSER DOES NOT SUPPORT VOICE";

                    return;

                }


                try {

                    recognition.start();

                } catch (error) {

                    console.log(
                        "Recognition start:",
                        error
                    );

                }

            }
        );


        // ==================================================
        // COMMAND CHIPS
        // ==================================================

        document
            .querySelectorAll(
                ".command-chip"
            )
            .forEach(
                function (chip) {

                    chip.addEventListener(
                        "click",
                        function (event) {

                            /*
                             * Prevent dragging
                             */

                            event.stopPropagation();


                            const command =
                                this.dataset.command;


                            transcript.textContent =
                                command;


                            sendCommand(
                                command
                            );

                        }
                    );

                }
            );


        // ==================================================
        // CAMERA
        // ==================================================

        async function startCamera() {

            try {

                const stream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({

                            video: {
                                facingMode:
                                    "user"
                            },

                            audio: false

                        });


                cameraBackground.srcObject =
                    stream;


            } catch (error) {

                console.warn(
                    "Camera unavailable:",
                    error
                );

                /*
                 * Camera is optional.
                 *
                 * The app continues working
                 * without camera access.
                 */

            }

        }


        if (
            navigator.mediaDevices &&
            navigator.mediaDevices.getUserMedia
        ) {

            startCamera();

        }


        // ==================================================
        // DRAGGABLE VOICE CARD
        // ==================================================

        let isDragging = false;

        let startX = 0;
        let startY = 0;

        let cardStartX = 0;
        let cardStartY = 0;


        voiceCard.addEventListener(
            "pointerdown",
            function (event) {

                /*
                 * Don't start dragging from buttons.
                 */

                if (
                    event.target.closest(
                        "button"
                    )
                ) {

                    return;

                }


                isDragging = true;


                voiceCard.classList.add(
                    "dragging"
                );


                voiceCard.setPointerCapture(
                    event.pointerId
                );


                const rect =
                    voiceCard.getBoundingClientRect();


                startX =
                    event.clientX;

                startY =
                    event.clientY;


                cardStartX =
                    rect.left;

                cardStartY =
                    rect.top;


                /*
                 * Remove transform so that
                 * left/top positioning becomes
                 * easier during dragging.
                 */

                voiceCard.style.transform =
                    "none";

                voiceCard.style.left =
                    `${cardStartX}px`;

                voiceCard.style.top =
                    `${cardStartY}px`;

            }
        );


        // ==================================================
        // DRAG MOVE
        // ==================================================

        voiceCard.addEventListener(
            "pointermove",
            function (event) {

                if (!isDragging) {
                    return;
                }


                const deltaX =
                    event.clientX -
                    startX;


                const deltaY =
                    event.clientY -
                    startY;


                let newLeft =
                    cardStartX +
                    deltaX;


                let newTop =
                    cardStartY +
                    deltaY;


                // ------------------------------------------
                // Keep card inside viewport
                // ------------------------------------------

                const rect =
                    voiceCard.getBoundingClientRect();


                const maxLeft =
                    window.innerWidth -
                    rect.width;


                const maxTop =
                    window.innerHeight -
                    rect.height;


                newLeft =
                    Math.max(
                        0,
                        Math.min(
                            newLeft,
                            maxLeft
                        )
                    );


                newTop =
                    Math.max(
                        0,
                        Math.min(
                            newTop,
                            maxTop
                        )
                    );


                voiceCard.style.left =
                    `${newLeft}px`;


                voiceCard.style.top =
                    `${newTop}px`;

            }
        );


        // ==================================================
        // DRAG END
        // ==================================================

        function stopDragging(event) {

            if (!isDragging) {
                return;
            }


            isDragging = false;


            voiceCard.classList.remove(
                "dragging"
            );


            try {

                voiceCard.releasePointerCapture(
                    event.pointerId
                );

            } catch (error) {

                console.log(error);

            }

        }


        voiceCard.addEventListener(
            "pointerup",
            stopDragging
        );


        voiceCard.addEventListener(
            "pointercancel",
            stopDragging
        );


        // ==================================================
        // WINDOW RESIZE
        // ==================================================

        window.addEventListener(
            "resize",
            function () {

                const rect =
                    voiceCard.getBoundingClientRect();


                let left =
                    rect.left;


                let top =
                    rect.top;


                const maxLeft =
                    window.innerWidth -
                    rect.width;


                const maxTop =
                    window.innerHeight -
                    rect.height;


                left =
                    Math.max(
                        0,
                        Math.min(
                            left,
                            maxLeft
                        )
                    );


                top =
                    Math.max(
                        0,
                        Math.min(
                            top,
                            maxTop
                        )
                    );


                voiceCard.style.left =
                    `${left}px`;


                voiceCard.style.top =
                    `${top}px`;


                voiceCard.style.transform =
                    "none";

            }
        );


        // ==================================================
        // INITIAL STATUS
        // ==================================================

        console.log(
            "Nova AI frontend initialized."
        );

        console.log(
            "Backend endpoint:",
            "/agent"
        );

    </script>

</body>

</html>
